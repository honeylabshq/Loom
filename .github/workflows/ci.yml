name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # Read the version from go.mod rather than repeating it here. setup-go
        # sets GOTOOLCHAIN=local for a pinned version, so a toolchain older than
        # the `go` directive fails hard instead of quietly fetching a newer one.
        # Every dependency update that raised the directive therefore went red
        # here while this said "1.21", which is a version bump breaking on the
        # copy of itself rather than on anything real.
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build -o loom ./cmd/loom

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile
          push: false
          load: true
          tags: loom:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
